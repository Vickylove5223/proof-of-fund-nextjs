media:
  input: public/wp-content/uploads
  output: /wp-content/uploads

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: type
        label: Type
        type: string
      - name: body
        label: Body
        type: rich-text
